spring:

  # Application Configuration
  application:
    name: globalcards

  # Profiles Configuration
  profiles:
    active: dev

  # Batch Configuration
  batch:
    job:
      enabled: false
    processing:
      chunk-size: ${batch.processing.chunk-size:1000}
      grid-size: ${batch.processing.grid-size:10}
      max-retries: ${batch.processing.max-retries:3}
      skip-limit: ${batch.processing.skip-limit:50}
    jdbc:
      initialize-schema: always

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

      properties:
        linger.ms: 5
        enable.idempotence: true
        spring.json.add.type.headers: false
        compression.type: snappy
        batch.size: 16384
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        max.in.flight.requests.per.connection: 5
        buffer.memory: 33554432

    topics:
      cards-ok: cards.ok
      cards-ko: cards.ko
      cards-dlq: cards.dlq

  # Datasource Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/globalcards
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      pool-name: GlobalCardsPool

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# AWS Configuration
aws:
  region: ${AWS_REGION:us-east-1}

  credentials:
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}

  s3:
    bucket: ${S3_BUCKET:global-cards-bucket}
    input-folder: ${S3_INPUT_FOLDER:input/}
    output-folder: ${S3_OUTPUT_FOLDER:output/}

# Logging
logging:
  level:
    root: WARN
    org.springframework: WARN
    com.bank.globalcards: DEBUG
    org.springframework.batch: DEBUG
    software.amazon.awssdk: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator / Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: globalcards
    distribution:
      percentiles-histogram:
        batch.chunk.processing.time: true

  prometheus:
    metrics:
      export:
        enabled: true